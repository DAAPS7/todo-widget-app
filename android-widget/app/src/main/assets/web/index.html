<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarefas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="widget">
    <div class="glass-bg"></div>

    <header class="header">
      <div>
        <p id="date" class="eyebrow"></p>
        <h1>Tarefas</h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
      <div class="header-actions">
        <button id="mode-btn" class="round-btn" aria-label="Alternar modo"></button>
        <button id="settings-btn" class="round-btn" title="Definições" aria-label="Definições"></button>
        <button id="quit" class="round-btn" title="Fechar" aria-label="Fechar"></button>
      </div>
    </header>

    <form id="add-form" class="composer">
      <div class="composer-row">
        <input id="new-task" type="text" placeholder="Nova tarefa" autocomplete="off" maxlength="200" aria-label="Nova tarefa">
        <button id="add-btn" type="submit" class="add-btn" aria-label="Adicionar"></button>
      </div>
      <div class="composer-date">
        <button id="date-btn" type="button" class="chip"></button>
        <button id="category-btn" type="button" class="chip"></button>
      </div>
      <div id="composer-cal"></div>
      <div id="composer-category-panel"></div>
    </form>

    <div id="filter-bar" class="filter-bar" hidden></div>

    <!-- Skeleton: aparece até a lista estar carregada (ver arranque em renderer.js) -->
    <div id="skeleton" class="skeleton" aria-hidden="true">
      <div class="skel-group">
        <div class="skel-title"></div>
        <div class="skel-list">
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar long"></span><span class="skel-bar short"></span></div>
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar"></span><span class="skel-bar short"></span></div>
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar long"></span></div>
        </div>
      </div>
      <div class="skel-group">
        <div class="skel-title short"></div>
        <div class="skel-list">
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar"></span><span class="skel-bar short"></span></div>
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar long"></span></div>
        </div>
      </div>
    </div>

    <div id="sections" class="sections" hidden></div>

    <section id="settings" class="settings" hidden>
      <div class="setting">
        <div class="setting-head">
          <span>Opacidade</span>
          <span id="opacity-value" class="setting-value"></span>
        </div>
        <input id="opacity" type="range" min="20" max="100" step="5" aria-label="Opacidade">
      </div>
      <div class="setting">
        <div class="setting-head">
          <span>Cor de destaque</span>
        </div>
        <div id="swatches" class="swatches"></div>
      </div>
      <div class="setting">
        <div class="setting-head">
          <span>Posição no ecrã</span>
        </div>
        <div id="positions" class="positions"></div>
      </div>
      <div class="setting">
        <div class="setting-head">
          <span>Conta Google (sincronização)</span>
        </div>
        <p id="google-status" class="sync-status"></p>
        <div class="sync-actions">
          <button id="google-connect-btn" type="button" class="done-btn" hidden>Ligar conta Google</button>
          <button id="google-disconnect-btn" type="button" class="link-btn" hidden>Desligar</button>
        </div>
      </div>
    </section>

    <p id="empty" class="empty" hidden></p>
  </main>
  <script src="api-bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
